<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Durete de l'eau potable</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 2em;
    }
    label, select {
      display: block;
      margin-top: 1em;
      width: 100%;
    }
    #result {
      margin-top: 2em;
      font-size: 1.2em;
    }
    .info {
      margin-top: 1em;
      color: #555;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h2>Obtenez la dureté de l'eau dans votre commune</h2>

  <label for="region">Région :</label>
  <select id="region"></select>

  <label for="departement">Département :</label>
  <select id="departement" disabled></select>

  <label for="commune">Commune :</label>
  <select id="commune" disabled></select>

  <div id="result"></div>

  <script>
    const regionSelect = document.getElementById('region');
    const departementSelect = document.getElementById('departement');
    const communeSelect = document.getElementById('commune');
    const resultDiv = document.getElementById('result');

    fetch('https://geo.api.gouv.fr/regions?fields=nom,code')
      .then(res => res.json())
      .then(data => {
        regionSelect.innerHTML = '<option value="">-- Sélectionnez une région --</option>';
        data.forEach(region => {
          const opt = document.createElement('option');
          opt.value = region.code;
          opt.textContent = region.nom;
          regionSelect.appendChild(opt);
        });
      });

    regionSelect.addEventListener('change', () => {
      departementSelect.innerHTML = '';
      communeSelect.innerHTML = '';
      resultDiv.innerHTML = '';
      departementSelect.disabled = true;
      communeSelect.disabled = true;

      fetch(`https://geo.api.gouv.fr/regions/${regionSelect.value}/departements`)
        .then(res => res.json())
        .then(data => {
          departementSelect.innerHTML = '<option value="">-- Sélectionnez un département --</option>';
          data.forEach(dep => {
            const opt = document.createElement('option');
            opt.value = dep.code;
            opt.textContent = `${dep.code} - ${dep.nom}`;
            departementSelect.appendChild(opt);
          });
          departementSelect.disabled = false;
        });
    });

    departementSelect.addEventListener('change', () => {
      communeSelect.innerHTML = '';
      resultDiv.innerHTML = '';
      communeSelect.disabled = true;

      fetch(`https://geo.api.gouv.fr/departements/${departementSelect.value}/communes?fields=nom,code`)
        .then(res => res.json())
        .then(data => {
          communeSelect.innerHTML = '<option value="">-- Sélectionnez une commune --</option>';
          data.forEach(com => {
            const opt = document.createElement('option');
            opt.value = com.code;
            opt.textContent = com.nom;
            communeSelect.appendChild(opt);
          });
          communeSelect.disabled = false;
        });
    });

    communeSelect.addEventListener('change', () => {
      const codeInsee = communeSelect.value;
      resultDiv.innerHTML = 'Chargement...';

      fetch(`https://hubeau.eaufrance.fr/api/v1/qualite_eau_potable/resultats_dis?code_commune=${codeInsee}&code_parametre=1532&size=1`)
        .then(res => res.json())
        .then(data => {
          if (!data.data || data.data.length === 0) {
            // fallback via UDI si pas de donnée
            fetch(`https://hubeau.eaufrance.fr/api/v1/qualite_eau_potable/udi?code_commune=${codeInsee}`)
              .then(r => r.json())
              .then(udis => {
                if (!udis.data || udis.data.length === 0) {
                  resultDiv.innerHTML = "Aucune donnée disponible pour cette commune.";
                } else {
                  const code_udi = udis.data[0].code_udi;
                  fetch(`https://hubeau.eaufrance.fr/api/v1/qualite_eau_potable/resultats_dis?code_udi=${code_udi}&code_parametre=1532&size=1`)
                    .then(res => res.json())
                    .then(data2 => {
                      if (!data2.data || data2.data.length === 0) {
                        resultDiv.innerHTML = "Aucune donnée disponible pour cette commune (via UDI).";
                      } else {
                        displayHardness(data2.data[0]);
                      }
                    });
                }
              });
            return;
          }
          displayHardness(data.data[0]);
        })
        .catch(() => {
          resultDiv.innerHTML = "Erreur lors de l'appel à l'API.";
        });
    });

    function displayHardness(d) {
      const interpretation = d.resultat_numerique < 15 ? "Eau douce" :
                             d.resultat_numerique < 25 ? "Eau moyennement dure" :
                             "Eau dure – adoucisseur recommandé";
      resultDiv.innerHTML = `
        <strong>Dureté :</strong> ${d.resultat_numerique} ${d.unite_parametre}<br>
        <span class="info">(prélèvement du ${d.date_prelevement.split('T')[0]})</span><br>
        <span class="info">${interpretation}</span>
      `;
    }
  </script>
</body>
</html>

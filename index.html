<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dureté de l'eau potable</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 1em;
      max-width: 600px;
      margin: auto;
    }
    input, button, select {
      padding: 8px;
      margin-top: 10px;
      margin-right: 10px;
    }
    #result {
      margin-top: 20px;
      font-size: 1.1em;
    }
    .info {
      margin-top: 10px;
      font-style: italic;
      color: #555;
    }
  </style>
</head>
<body>
  <h2>Dureté de l'eau potable</h2>

  <label>Code postal : </label>
  <input type="text" id="code_postal" placeholder="ex: 54130">
  <button onclick="chargerCommunes()">Rechercher</button>

  <div id="commune_select_container" style="display:none;">
    <label for="commune_select">Choisissez votre commune :</label><br>
    <select id="commune_select" onchange="afficherDurete()"></select>
  </div>

  <div id="result"></div>

  <script>
    let communes = {};
    let duretes_locales = {};

    // Charger les deux fichiers JSON en mémoire
    fetch('codes_postaux_communes.json')
      .then(res => res.json())
      .then(data => communes = data);

    fetch('durete.json')
      .then(res => res.json())
      .then(data => duretes_locales = data);

    function chargerCommunes() {
      const cp = document.getElementById("code_postal").value.trim();
      const select = document.getElementById("commune_select");
      const container = document.getElementById("commune_select_container");
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "";

      if (!communes[cp]) {
        container.style.display = "none";
        resultDiv.innerHTML = "Aucune commune trouvée pour ce code postal.";
        return;
      }

      select.innerHTML = "";
      communes[cp].forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.codeinsee;
        opt.textContent = c.nom;
        select.appendChild(opt);
      });

      container.style.display = "block";
      afficherDurete(); // Affiche la première par défaut
    }

    async function getDureteFromAPI(codeInsee) {
      const url = `https://hubeau.eaufrance.fr/api/v1/qualite_eau_potable/resultats_dis?code_commune=${codeInsee}&code_parametre=1532&size=1`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const result = data?.data?.[0];
        if (!result) return null;

        return {
          durete: result.resultat_numerique,
          unite: result.unite_parametre,
          date: result.date_prelevement?.split("T")[0] ?? "Inconnue"
        };
      } catch {
        return null;
      }
    }

    async function afficherDurete() {
      const insee = document.getElementById("commune_select").value;
      const resultDiv = document.getElementById("result");

      resultDiv.innerHTML = "Chargement...";

      // Essayer via l'API Hubeau
      let d = await getDureteFromAPI(insee);

      // Sinon, fallback sur les données locales
      if (!d && duretes_locales[insee]) {
        d = duretes_locales[insee];
        d.source = " (source locale)";
      }

      if (!d) {
        resultDiv.innerHTML = "Aucune donnée de dureté disponible pour cette commune.";
        return;
      }

      let recommandation = "";
      if (d.durete < 15) recommandation = "Eau douce : aucun adoucisseur nécessaire.";
      else if (d.durete < 25) recommandation = "Eau moyennement dure : adoucisseur facultatif selon les usages.";
      else recommandation = "Eau dure : adoucisseur recommandé.";

      resultDiv.innerHTML = `
        <strong>Dureté :</strong> ${d.durete} ${d.unite} (prélevée le ${d.date}) ${d.source ?? ""}<br>
        <div class="info">${recommandation}</div>
      `;
    }
  </script>
</body>
</html>
